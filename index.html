<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      font-size: 18px;
      box-sizing: border-box;
    }

    button {
      width: 45%;
      padding: 15px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .buy {
      background: green;
      color: white;
    }

    .sell {
      background: red;
      color: white;
    }

    .exit {
      width: 92%;
      background: #333;
      color: white;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    .position {
      margin-top: 20px;
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
    }

    #pnl {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }

    #message {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Trade Practice</h1>

  <h2>
    Virtual Balance: ₹<span id="balance">50000</span>
  </h2>

  <div class="price">
    NIFTY 50<br>
    <span id="niftyPrice">25000</span>
  </div>

  <input
    type="number"
    id="quantity"
    placeholder="Quantity"
  >

  <input
    type="number"
    id="entryPrice"
    placeholder="Entry Price"
  >

  <input
    type="number"
    id="currentPrice"
    placeholder="Current Price"
  >

  <button class="buy" onclick="openBuy()">
    BUY
  </button>

  <button class="sell" onclick="openSell()">
    SELL
  </button>

  <div class="position">

    <h3>Open Position</h3>

    <div id="positionInfo">
      No open position
    </div>

    <div id="pnl">
      P&L: ₹0
    </div>

    <button class="exit" onclick="exitTrade()">
      EXIT POSITION
    </button>

  </div>

  <div id="message">
    Ready to trade
  </div>

</div>

<script>

let position = null;

let balance = 50000;


function openBuy() {

  let quantity =
    Number(document.getElementById("quantity").value);

  let entry =
    Number(document.getElementById("entryPrice").value);

  if (quantity <= 0 || entry <= 0) {
    document.getElementById("message").textContent =
      "Enter valid quantity and entry price";

    return;
  }

  position = {
    type: "BUY",
    quantity: quantity,
    entry: entry
  };

  showPosition();

  document.getElementById("message").textContent =
    "BUY position opened";
}


function openSell() {

  let quantity =
    Number(document.getElementById("quantity").value);

  let entry =
    Number(document.getElementById("entryPrice").value);

  if (quantity <= 0 || entry <= 0) {
    document.getElementById("message").textContent =
      "Enter valid quantity and entry price";

    return;
  }

  position = {
    type: "SELL",
    quantity: quantity,
    entry: entry
  };

  showPosition();

  document.getElementById("message").textContent =
    "SELL position opened";
}


function showPosition() {

  if (!position) {
    return;
  }

  let current =
    Number(document.getElementById("currentPrice").value);

  let pnl;

  if (position.type === "BUY") {

    pnl =
      (current - position.entry) *
      position.quantity;

  } else {

    pnl =
      (position.entry - current) *
      position.quantity;
  }

  document.getElementById("positionInfo").textContent =
    position.type +
    " | Qty: " +
    position.quantity +
    " | Entry: ₹" +
    position.entry;

  document.getElementById("pnl").textContent =
    "P&L: ₹" + pnl;
}


function exitTrade() {

  if (!position) {

    document.getElementById("message").textContent =
      "No open position";

    return;
  }

  let current =
    Number(document.getElementById("currentPrice").value);

  let pnl;

  if (position.type === "BUY") {

    pnl =
      (current - position.entry) *
      position.quantity;

  } else {

    pnl =
      (position.entry - current) *
      position.quantity;
  }

  balance = balance + pnl;

  document.getElementById("balance").textContent =
    balance;

  document.getElementById("positionInfo").textContent =
    "No open position";

  document.getElementById("pnl").textContent =
    "P&L: ₹0";

  document.getElementById("message").textContent =
    "Trade exited. P&L: ₹" + pnl;

  position = null;
}

</script>

</body>
</html>
