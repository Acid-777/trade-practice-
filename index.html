<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Practice</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.app {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
}

input {
  width: 90%;
  padding: 12px;
  margin: 8px 0;
  font-size: 18px;
  box-sizing: border-box;
}

button {
  width: 45%;
  padding: 15px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

.buy {
  background: green;
  color: white;
}

.sell {
  background: red;
  color: white;
}

.update {
  width: 92%;
  background: #1976d2;
  color: white;
}

.exit {
  width: 92%;
  background: #333;
  color: white;
}

.clear {
  width: 92%;
  background: #777;
  color: white;
  margin-top: 15px;
}

.price {
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0;
}

.position,
.history,
.stats,
.risk {
  margin-top: 20px;
  padding: 15px;
  background: #f0f0f0;
  border-radius: 10px;
}

#pnl,
#totalPnl,
#riskReward {
  margin-top: 15px;
  font-size: 22px;
  font-weight: bold;
}

.trade {
  background: white;
  padding: 16px;
  margin: 12px 0;
  border-radius: 14px;
  text-align: left;
  font-size: 14px;
  line-height: 1.6;
  border-left: 5px solid #777;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.trade.win {
  border-left-color: #16a34a;
}

.trade.loss {
  border-left-color: #dc2626;
}

.trade-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.trade-number {
  font-weight: bold;
  font-size: 16px;
}

.badge {
  display: inline-block;
  padding: 4px 8px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: bold;
  margin-right: 4px;
}

.buy-badge {
  background: #dcfce7;
  color: #166534;
}

.sell-badge {
  background: #fee2e2;
  color: #991b1b;
}

.win-badge {
  background: #dcfce7;
  color: #166534;
}

.loss-badge {
  background: #fee2e2;
  color: #991b1b;
}

.exit-badge {
  background: #e5e7eb;
  color: #374151;
}

.trade-pnl {
  font-size: 18px;
  font-weight: bold;
  margin-top: 8px;
}

.trade-details {
  color: #555;
  margin-top: 5px;
}

.stat {
  font-size: 18px;
  margin: 8px;
}

#message {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

<h1>Trade Practice</h1>

<h2>
Virtual Balance: ₹<span id="balance">50000</span>
</h2>

<div class="price">
NIFTY 50<br>
25000
</div>

<input
type="number"
id="quantity"
placeholder="Quantity">

<input
type="number"
id="entryPrice"
placeholder="Entry Price">

<input
type="number"
id="currentPrice"
placeholder="Current Price">

<button
class="update"
onclick="updatePrice()">
UPDATE PRICE
</button>

<div class="risk">

<h3>Risk Management</h3>

<input
type="number"
id="stopLoss"
placeholder="Stop Loss">

<input
type="number"
id="target"
placeholder="Target">

<div id="riskReward">
Risk : Reward = -
</div>

</div>

<button
class="buy"
onclick="openBuy()">
BUY
</button>

<button
class="sell"
onclick="openSell()">
SELL
</button>

<div class="position">

<h3>Open Position</h3>

<div id="positionInfo">
No open position
</div>

<div id="pnl">
P&L: ₹0
</div>

<button
class="exit"
onclick="exitTrade()">
EXIT POSITION
</button>

</div>

<div id="message">
Ready to trade
</div>

<div class="history">

<h3>Trade Journal</h3>

<div id="trades">
No trades yet
</div>

<div id="totalPnl">
Total P&L: ₹0
</div>

<button
class="clear"
onclick="clearAllData()">
CLEAR ALL DATA
</button>

</div>

<div class="stats">

<h3>Trading Statistics</h3>

<div class="stat">
Total Trades:
<span id="totalTrades">0</span>
</div>

<div class="stat">
Winning Trades:
<span id="wins">0</span>
</div>

<div class="stat">
Losing Trades:
<span id="losses">0</span>
</div>

<div class="stat">
Win Rate:
<span id="winRate">0%</span>
</div>

</div>

</div>

<script>

let position = null;

let balance = 50000;

let totalPnl = 0;

let tradeNumber = 0;

let wins = 0;

let losses = 0;

let tradeHistory = [];


/* LOAD DATA */

function loadData() {

let savedData =
localStorage.getItem("tradePracticeData");

if (!savedData) {
return;
}

try {

let data =
JSON.parse(savedData);

balance =
data.balance ?? 50000;

totalPnl =
data.totalPnl ?? 0;

tradeNumber =
data.tradeNumber ?? 0;

wins =
data.wins ?? 0;

losses =
data.losses ?? 0;

tradeHistory =
data.tradeHistory ?? [];

} catch (error) {

console.log("Could not load saved data");

}

}


/* SAVE DATA */

function saveData() {

let data = {

balance: balance,

totalPnl: totalPnl,

tradeNumber: tradeNumber,

wins: wins,

losses: losses,

tradeHistory: tradeHistory

};

localStorage.setItem(
"tradePracticeData",
JSON.stringify(data)
);

}


/* DISPLAY HISTORY */

function displaySavedHistory() {

let container =
document.getElementById("trades");

container.innerHTML = "";

if (tradeHistory.length === 0) {

container.textContent =
"No trades yet";

return;

}

tradeHistory.forEach(function(trade) {

displayTrade(trade);

});

}


/* DISPLAY ONE TRADE */

function displayTrade(trade) {

let container =
document.getElementById("trades");

let element =
document.createElement("div");

element.className =
"trade";

let result =
trade.pnl > 0
? "WIN"
: trade.pnl < 0
? "LOSS"
: "BREAKEVEN";

let pnlText =
trade.pnl > 0
? "+₹" + trade.pnl
: "₹" + trade.pnl;

element.innerHTML =

"<strong>Trade #" +
trade.number +
"</strong><br>" +

trade.type +
" · Qty: " +
trade.quantity +
"<br>" +

"Entry: ₹" +
trade.entry +
" → Exit: ₹" +
trade.exit +
"<br>" +

"SL: ₹" +
trade.sl +
" · Target: ₹" +
trade.target +
"<br>" +

"Result: " +
result +
" · P&L: " +
pnlText +
"<br>" +

"Exit: " +
trade.exitReason +
"<br>" +

"Date: " +
trade.dateTime;

container.appendChild(element);

}


/* INITIALIZE */

loadData();

document.getElementById("balance").textContent =
balance;

document.getElementById("totalPnl").textContent =
"Total P&L: ₹" + totalPnl;

updateStats();

displaySavedHistory();


/* RISK REWARD */

function calculateRiskReward() {

let entry =
Number(document.getElementById("entryPrice").value);

let sl =
Number(document.getElementById("stopLoss").value);

let target =
Number(document.getElementById("target").value);

if (
entry <= 0 ||
sl <= 0 ||
target <= 0
) {

document.getElementById("riskReward").textContent =
"Risk : Reward = -";

return;

}

let risk =
Math.abs(entry - sl);

let reward =
Math.abs(target - entry);

if (risk === 0) {

document.getElementById("riskReward").textContent =
"Risk : Reward = -";

return;

}

let ratio =
reward / risk;

document.getElementById("riskReward").textContent =
"Risk : Reward = 1:" +
ratio.toFixed(2);

}


document.getElementById("entryPrice")
.addEventListener(
"input",
calculateRiskReward
);

document.getElementById("stopLoss")
.addEventListener(
"input",
calculateRiskReward
);

document.getElementById("target")
.addEventListener(
"input",
calculateRiskReward
);


/* BUY */

function openBuy() {

if (position) {

document.getElementById("message").textContent =
"Close the existing position first";

return;

}

let quantity =
Number(document.getElementById("quantity").value);

let entry =
Number(document.getElementById("entryPrice").value);

let sl =
Number(document.getElementById("stopLoss").value);

let target =
Number(document.getElementById("target").value);

if (
quantity <= 0 ||
entry <= 0 ||
sl <= 0 ||
target <= 0
) {

document.getElementById("message").textContent =
"Enter valid trade values";

return;

}

if (sl >= entry) {

document.getElementById("message").textContent =
"For BUY, SL must be below Entry";

return;

}

if (target <= entry) {

document.getElementById("message").textContent =
"For BUY, Target must be above Entry";

return;

}

position = {

type: "BUY",

quantity: quantity,

entry: entry,

sl: sl,

target: target

};

showPosition();

document.getElementById("message").textContent =
"BUY position opened";

}


/* SELL */

function openSell() {

if (position) {

document.getElementById("message").textContent =
"Close the existing position first";

return;

}

let quantity =
Number(document.getElementById("quantity").value);

let entry =
Number(document.getElementById("entryPrice").value);

let sl =
Number(document.getElementById("stopLoss").value);

let target =
Number(document.getElementById("target").value);

if (
quantity <= 0 ||
entry <= 0 ||
sl <= 0 ||
target <= 0
) {

document.getElementById("message").textContent =
"Enter valid trade values";

return;

}

if (sl <= entry) {

document.getElementById("message").textContent =
"For SELL, SL must be above Entry";

return;

}

if (target >= entry) {

document.getElementById("message").textContent =
"For SELL, Target must be below Entry";

return;

}

position = {

type: "SELL",

quantity: quantity,

entry: entry,

sl: sl,

target: target

};

showPosition();

document.getElementById("message").textContent =
"SELL position opened";

}


/* SHOW POSITION */

function showPosition() {

if (!position) {
return;
}

let current =
Number(document.getElementById("currentPrice").value);

let pnl;

if (position.type === "BUY") {

pnl =
(current - position.entry) *
position.quantity;

} else {

pnl =
(position.entry - current) *
position.quantity;

}

document.getElementById("positionInfo").textContent =

position.type +
" | Qty: " +
position.quantity +
" | Entry: ₹" +
position.entry +
" | SL: ₹" +
position.sl +
" | Target: ₹" +
position.target;

document.getElementById("pnl").textContent =
"P&L: ₹" + pnl;

}


/* UPDATE PRICE */

function updatePrice() {

let current =
Number(document.getElementById("currentPrice").value);

if (current <= 0) {

document.getElementById("message").textContent =
"Enter a valid current price";

return;

}

if (!position) {

document.getElementById("message").textContent =
"Price updated";

return;

}

showPosition();


if (position.type === "BUY") {

if (current <= position.sl) {

closeAutomatically(
position.sl,
"STOP LOSS"
);

return;

}

if (current >= position.target) {

closeAutomatically(
position.target,
"TARGET"
);

return;

}

}


if (position.type === "SELL") {

if (current >= position.sl) {

closeAutomatically(
position.sl,
"STOP LOSS"
);

return;

}

if (current <= position.target) {

closeAutomatically(
position.target,
"TARGET"
);

return;

}

}

document.getElementById("message").textContent =
"Price updated";

}


/* AUTOMATIC EXIT */

function closeAutomatically(
exitPrice,
reason
) {

let pnl;

if (position.type === "BUY") {

pnl =
(exitPrice - position.entry) *
position.quantity;

} else {

pnl =
(position.entry - exitPrice) *
position.quantity;

}

recordTrade(
exitPrice,
pnl,
reason
);

document.getElementById("message").textContent =
reason +
" HIT | P&L: ₹" +
pnl;

}


/* MANUAL EXIT */

function exitTrade() {

if (!position) {

document.getElementById("message").textContent =
"No open position";

return;

}

let current =
Number(document.getElementById("currentPrice").value);

if (current <= 0) {

document.getElementById("message").textContent =
"Enter current price first";

return;

}

let pnl;

if (position.type === "BUY") {

pnl =
(current - position.entry) *
position.quantity;

} else {

pnl =
(position.entry - current) *
position.quantity;

}

recordTrade(
current,
pnl,
"MANUAL"
);

document.getElementById("message").textContent =
"MANUAL EXIT | P&L: ₹" +
pnl;

}


/* RECORD TRADE */

function recordTrade(
exitPrice,
pnl,
exitReason
) {

let oldPosition =
position;

balance += pnl;

totalPnl += pnl;

tradeNumber++;

if (pnl > 0) {

wins++;

} else if (pnl < 0) {

losses++;

}

let trade = {

number: tradeNumber,

type: oldPosition.type,

quantity: oldPosition.quantity,

entry: oldPosition.entry,

exit: exitPrice,

sl: oldPosition.sl,

target: oldPosition.target,

pnl: pnl,

exitReason: exitReason,

dateTime: new Date()
.toLocaleString()

};

tradeHistory.push(trade);

saveData();

document.getElementById("balance").textContent =
balance;

document.getElementById("positionInfo").textContent =
"No open position";

document.getElementById("pnl").textContent =
"P&L: ₹0";

displayTrade(trade);

document.getElementById("totalPnl").textContent =
"Total P&L: ₹" +
totalPnl;

updateStats();

position = null;

}


/* STATISTICS */

function updateStats() {

let total =
wins + losses;

let winRate = 0;

if (total > 0) {

winRate =
(wins / total) * 100;

}

document.getElementById("totalTrades")
.textContent =
total;

document.getElementById("wins")
.textContent =
wins;

document.getElementById("losses")
.textContent =
losses;

document.getElementById("winRate")
.textContent =
winRate.toFixed(2) + "%";

}


/* CLEAR DATA */

function clearAllData() {

let confirmed =
confirm(
"Delete all saved trading data?"
);

if (!confirmed) {
return;
}

localStorage.removeItem(
"tradePracticeData"
);

balance = 50000;

totalPnl = 0;

tradeNumber = 0;

wins = 0;

losses = 0;

tradeHistory = [];

position = null;

document.getElementById("balance").textContent =
balance;

document.getElementById("totalPnl").textContent =
"Total P&L: ₹0";

document.getElementById("positionInfo").textContent =
"No open position";

document.getElementById("pnl").textContent =
"P&L: ₹0";

document.getElementById("trades").textContent =
"No trades yet";

updateStats();

document.getElementById("message").textContent =
"All data cleared";

}

</script>

</body>
</html>
