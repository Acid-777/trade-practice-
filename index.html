<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Practice</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
  text-align: center;
}

.app {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
}

input {
  width: 90%;
  padding: 12px;
  margin: 8px 0;
  font-size: 18px;
  box-sizing: border-box;
}

button {
  width: 45%;
  padding: 15px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}

.buy {
  background: green;
  color: white;
}

.sell {
  background: red;
  color: white;
}

.update {
  width: 92%;
  background: #1976d2;
  color: white;
}

.exit {
  width: 92%;
  background: #333;
  color: white;
}

.price {
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0;
}

.position,
.history,
.stats,
.risk {
  margin-top: 20px;
  padding: 15px;
  background: #f0f0f0;
  border-radius: 10px;
}

#pnl,
#totalPnl,
#riskReward {
  margin-top: 15px;
  font-size: 22px;
  font-weight: bold;
}

.trade {
  background: white;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
}

.stat {
  font-size: 18px;
  margin: 8px;
}

#message {
  margin-top: 15px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

<h1>Trade Practice</h1>

<h2>
Virtual Balance: ₹<span id="balance">50000</span>
</h2>

<div class="price">
NIFTY 50<br>
25000
</div>

<input
type="number"
id="quantity"
placeholder="Quantity">

<input
type="number"
id="entryPrice"
placeholder="Entry Price">

<input
type="number"
id="currentPrice"
placeholder="Current Price">

<button
class="update"
onclick="updatePrice()">
UPDATE PRICE
</button>

<div class="risk">

<h3>Risk Management</h3>

<input
type="number"
id="stopLoss"
placeholder="Stop Loss">

<input
type="number"
id="target"
placeholder="Target">

<div id="riskReward">
Risk : Reward = -
</div>

</div>

<button
class="buy"
onclick="openBuy()">
BUY
</button>

<button
class="sell"
onclick="openSell()">
SELL
</button>

<div class="position">

<h3>Open Position</h3>

<div id="positionInfo">
No open position
</div>

<div id="pnl">
P&L: ₹0
</div>

<button
class="exit"
onclick="exitTrade()">
EXIT POSITION
</button>

</div>

<div id="message">
Ready to trade
</div>

<div class="history">

<h3>Trade History</h3>

<div id="trades">
No trades yet
</div>

<div id="totalPnl">
Total P&L: ₹0
</div>

</div>

<div class="stats">

<h3>Trading Statistics</h3>

<div class="stat">
Total Trades:
<span id="totalTrades">0</span>
</div>

<div class="stat">
Winning Trades:
<span id="wins">0</span>
</div>

<div class="stat">
Losing Trades:
<span id="losses">0</span>
</div>

<div class="stat">
Win Rate:
<span id="winRate">0%</span>
</div>

</div>

</div>

<script>

let position = null;

let balance = 50000;

let totalPnl = 0;

let tradeNumber = 0;

let wins = 0;

let losses = 0;


/* RISK / REWARD */

function calculateRiskReward() {

let entry =
Number(document.getElementById("entryPrice").value);

let sl =
Number(document.getElementById("stopLoss").value);

let target =
Number(document.getElementById("target").value);

if (
entry <= 0 ||
sl <= 0 ||
target <= 0
) {

document.getElementById("riskReward").textContent =
"Risk : Reward = -";

return;
}

let risk =
Math.abs(entry - sl);

let reward =
Math.abs(target - entry);

if (risk === 0) {

document.getElementById("riskReward").textContent =
"Risk : Reward = -";

return;
}

let ratio =
reward / risk;

document.getElementById("riskReward").textContent =
"Risk : Reward = 1:" +
ratio.toFixed(2);
}


document.getElementById("entryPrice")
.addEventListener(
"input",
calculateRiskReward
);

document.getElementById("stopLoss")
.addEventListener(
"input",
calculateRiskReward
);

document.getElementById("target")
.addEventListener(
"input",
calculateRiskReward
);


/* OPEN BUY */

function openBuy() {

if (position) {

document.getElementById("message").textContent =
"Close the existing position first";

return;
}

let quantity =
Number(document.getElementById("quantity").value);

let entry =
Number(document.getElementById("entryPrice").value);

let sl =
Number(document.getElementById("stopLoss").value);

let target =
Number(document.getElementById("target").value);

if (
quantity <= 0 ||
entry <= 0 ||
sl <= 0 ||
target <= 0
) {

document.getElementById("message").textContent =
"Enter valid trade values";

return;
}

if (sl >= entry) {

document.getElementById("message").textContent =
"For BUY, SL must be below Entry";

return;
}

if (target <= entry) {

document.getElementById("message").textContent =
"For BUY, Target must be above Entry";

return;
}

position = {

type: "BUY",

quantity: quantity,

entry: entry,

sl: sl,

target: target

};

showPosition();

document.getElementById("message").textContent =
"BUY position opened";
}


/* OPEN SELL */

function openSell() {

if (position) {

document.getElementById("message").textContent =
"Close the existing position first";

return;
}

let quantity =
Number(document.getElementById("quantity").value);

let entry =
Number(document.getElementById("entryPrice").value);

let sl =
Number(document.getElementById("stopLoss").value);

let target =
Number(document.getElementById("target").value);

if (
quantity <= 0 ||
entry <= 0 ||
sl <= 0 ||
target <= 0
) {

document.getElementById("message").textContent =
"Enter valid trade values";

return;
}

if (sl <= entry) {

document.getElementById("message").textContent =
"For SELL, SL must be above Entry";

return;
}

if (target >= entry) {

document.getElementById("message").textContent =
"For SELL, Target must be below Entry";

return;
}

position = {

type: "SELL",

quantity: quantity,

entry: entry,

sl: sl,

target: target

};

showPosition();

document.getElementById("message").textContent =
"SELL position opened";
}


/* SHOW POSITION */

function showPosition() {

if (!position) {

return;
}

let current =
Number(document.getElementById("currentPrice").value);

let pnl;

if (position.type === "BUY") {

pnl =
(current - position.entry) *
position.quantity;

} else {

pnl =
(position.entry - current) *
position.quantity;
}

document.getElementById("positionInfo").textContent =

position.type +
" | Qty: " +
position.quantity +
" | Entry: ₹" +
position.entry +
" | SL: ₹" +
position.sl +
" | Target: ₹" +
position.target;

document.getElementById("pnl").textContent =
"P&L: ₹" + pnl;
}


/* UPDATE MARKET PRICE */

function updatePrice() {

let current =
Number(document.getElementById("currentPrice").value);

if (current <= 0) {

document.getElementById("message").textContent =
"Enter a valid current price";

return;
}

if (!position) {

document.getElementById("message").textContent =
"Price updated";

return;
}

showPosition();


/* BUY SL / TARGET */

if (position.type === "BUY") {

if (current <= position.sl) {

closeAutomatically(
position.sl,
"STOP LOSS HIT"
);

return;
}

if (current >= position.target) {

closeAutomatically(
position.target,
"TARGET HIT"
);

return;
}
}


/* SELL SL / TARGET */

if (position.type === "SELL") {

if (current >= position.sl) {

closeAutomatically(
position.sl,
"STOP LOSS HIT"
);

return;
}

if (current <= position.target) {

closeAutomatically(
position.target,
"TARGET HIT"
);

return;
}

}

document.getElementById("message").textContent =
"Price updated";

}


/* AUTOMATIC EXIT */

function closeAutomatically(
exitPrice,
reason
) {

let pnl;

if (position.type === "BUY") {

pnl =
(exitPrice - position.entry) *
position.quantity;

} else {

pnl =
(position.entry - exitPrice) *
position.quantity;
}

recordTrade(
exitPrice,
pnl
);

document.getElementById("message").textContent =
reason + " | P&L: ₹" + pnl;
}


/* MANUAL EXIT */

function exitTrade() {

if (!position) {

document.getElementById("message").textContent =
"No open position";

return;
}

let current =
Number(document.getElementById("currentPrice").value);

if (current <= 0) {

document.getElementById("message").textContent =
"Enter current price first";

return;
}

let pnl;

if (position.type === "BUY") {

pnl =
(current - position.entry) *
position.quantity;

} else {

pnl =
(position.entry - current) *
position.quantity;
}

recordTrade(
current,
pnl
);

document.getElementById("message").textContent =
"Trade exited | P&L: ₹" + pnl;
}


/* RECORD TRADE */

function recordTrade(
exitPrice,
pnl
) {

balance += pnl;

totalPnl += pnl;

tradeNumber++;

if (pnl > 0) {

wins++;

} else if (pnl < 0) {

losses++;
}

let oldPosition = position;

document.getElementById("balance").textContent =
balance;

document.getElementById("positionInfo").textContent =
"No open position";

document.getElementById("pnl").textContent =
"P&L: ₹0";

addTrade(
tradeNumber,
oldPosition.type,
oldPosition.quantity,
oldPosition.entry,
exitPrice,
oldPosition.sl,
oldPosition.target,
pnl
);

updateStats();

position = null;
}


/* ADD TRADE TO HISTORY */

function addTrade(
number,
type,
quantity,
entry,
exit,
sl,
target,
pnl
) {

let trade =
document.createElement("div");

trade.className = "trade";

trade.textContent =

"#" + number +
" | " + type +
" | Qty: " + quantity +
" | Entry: ₹" + entry +
" | Exit: ₹" + exit +
" | SL: ₹" + sl +
" | Target: ₹" + target +
" | P&L: ₹" + pnl;

document.getElementById("trades")
.appendChild(trade);

document.getElementById("totalPnl")
.textContent =
"Total P&L: ₹" + totalPnl;
}


/* STATISTICS */

function updateStats() {

let total =
wins + losses;

let winRate = 0;

if (total > 0) {

winRate =
(wins / total) * 100;
}

document.getElementById("totalTrades")
.textContent =
total;

document.getElementById("wins")
.textContent =
wins;

document.getElementById("losses")
.textContent =
losses;

document.getElementById("winRate")
.textContent =
winRate.toFixed(2) + "%";
}

</script>

</body>
</html>
