<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trade Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .balance {
      font-size: 22px;
      font-weight: bold;
      margin: 20px 0;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    button {
      width: 45%;
      padding: 15px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: green;
      color: white;
    }

    .sell {
      background: red;
      color: white;
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>Trade Practice</h1>

    <div class="balance">
      Virtual Balance: ₹50,000
    </div>

    <div class="price">
      NIFTY 50<br>
      <span id="niftyPrice">25,000</span>
    </div>

    <button class="buy" onclick="buyTrade()">
      BUY
    </button>

    <button class="sell" onclick="sellTrade()">
      SELL
    </button>

    <div id="message">
      Ready to trade
    </div>

  </div>

  <script>

    function buyTrade() {
      document.getElementById("message").textContent =
        "BUY order selected";
    }

    function sellTrade() {
      document.getElementById("message").textContent =
        "SELL order selected";
    }

  </script>

</body>
</html>
