<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .app {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      font-size: 18px;
      box-sizing: border-box;
    }

    button {
      width: 45%;
      padding: 15px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .buy {
      background: green;
      color: white;
    }

    .sell {
      background: red;
      color: white;
    }

    .price {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    #message {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    #pnl {
      margin-top: 15px;
      font-size: 22px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Trade Practice</h1>

  <h2>Virtual Balance: ₹50,000</h2>

  <div class="price">
    NIFTY 50<br>
    25,000
  </div>

  <input type="number" id="quantity" placeholder="Quantity">

  <input type="number" id="entryPrice" placeholder="Entry Price">

  <input type="number" id="currentPrice" placeholder="Current Price">

  <button class="buy" onclick="buyTrade()">BUY</button>

  <button class="sell" onclick="sellTrade()">SELL</button>

  <div id="message">
    Ready to trade
  </div>

  <div id="pnl">
    P&L: ₹0
  </div>

</div>

<script>

function buyTrade() {

  let quantity =
    Number(document.getElementById("quantity").value);

  let entryPrice =
    Number(document.getElementById("entryPrice").value);

  let currentPrice =
    Number(document.getElementById("currentPrice").value);

  let pnl =
    (currentPrice - entryPrice) * quantity;

  document.getElementById("message").textContent =
    "BUY position";

  document.getElementById("pnl").textContent =
    "P&L: ₹" + pnl;
}


function sellTrade() {

  let quantity =
    Number(document.getElementById("quantity").value);

  let entryPrice =
    Number(document.getElementById("entryPrice").value);

  let currentPrice =
    Number(document.getElementById("currentPrice").value);

  let pnl =
    (entryPrice - currentPrice) * quantity;

  document.getElementById("message").textContent =
    "SELL position";

  document.getElementById("pnl").textContent =
    "P&L: ₹" + pnl;
}

</script>

</body>
</html>
